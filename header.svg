<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Evan Atharasya, Full-Stack Developer</title>
  <desc id="d">Animated banner: Evan Atharasya, full-stack developer focused on web applications, AI and automation. Open for freelance work.</desc>

  <defs>
    <clipPath id="clip"><rect width="1200" height="340" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0B1B36"/>
      <stop offset="1" stop-color="#10264A"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79C0FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58A6FF" stroke-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace; }

    /* aurora */
    .a1 { animation: drift1 14s ease-in-out infinite alternate; }
    .a2 { animation: drift2 17s ease-in-out infinite alternate; }
    .a3 { animation: drift3 12s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0); }   to { transform: translate(120px,40px); } }
    @keyframes drift2 { from { transform: translate(0,0); }   to { transform: translate(-140px,-50px); } }
    @keyframes drift3 { from { transform: translate(0,0); }   to { transform: translate(80px,60px); } }

    /* rotating terminal phrases (first phrase is the static fallback) */
    .ph { opacity: 0; animation: cycle 12s infinite both; }
    .p1 { opacity: 1; animation-delay: 0s; }
    .p2 { animation-delay: 3s; }
    .p3 { animation-delay: 6s; }
    .p4 { animation-delay: 9s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(10px); }
      4%   { opacity: 1; transform: translateY(0); }
      21%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    /* code card */
    .card { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .ln { animation: reveal .7s ease-out both; }
    .l1 { animation-delay: .4s; } .l2 { animation-delay: .8s; } .l3 { animation-delay: 1.2s; }
    .l4 { animation-delay: 1.6s; } .l5 { animation-delay: 2.0s; } .l6 { animation-delay: 2.4s; }
    @keyframes reveal { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

    /* chips */
    .chip { animation: bob 4s ease-in-out infinite; }
    .c2 { animation-delay: -.8s; } .c3 { animation-delay: -1.6s; } .c4 { animation-delay: -2.4s; } .c5 { animation-delay: -3.2s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    /* status dot */
    .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3.2); opacity: 0; } }

    /* particles */
    .pt { animation: rise 11s linear infinite; opacity: 0; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .7; } 90% { opacity: .5; } 100% { transform: translateY(-380px); opacity: 0; } }

    /* bottom light sweep */
    .sweep { animation: sweep 5s linear infinite; }
    @keyframes sweep { from { transform: translateX(-400px); } to { transform: translateX(1200px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- aurora glow -->
    <g filter="url(#blur)">
      <circle class="a1" cx="220" cy="90"  r="140" fill="#1F6FEB" opacity="0.40"/>
      <circle class="a2" cx="960" cy="280" r="170" fill="#8957E5" opacity="0.30"/>
      <circle class="a3" cx="620" cy="30"  r="120" fill="#39D0D8" opacity="0.18"/>
    </g>

    <!-- particles -->
    <g fill="#79C0FF">
      <circle class="pt" cx="90"   cy="350" r="2"   style="animation-delay:0s;   animation-duration:10s"/>
      <circle class="pt" cx="210"  cy="350" r="1.5" style="animation-delay:2s;   animation-duration:13s"/>
      <circle class="pt" cx="340"  cy="350" r="2.5" style="animation-delay:5s;   animation-duration:9s"/>
      <circle class="pt" cx="470"  cy="350" r="1.5" style="animation-delay:1s;   animation-duration:12s"/>
      <circle class="pt" cx="590"  cy="350" r="2"   style="animation-delay:6s;   animation-duration:11s"/>
      <circle class="pt" cx="680"  cy="350" r="1.5" style="animation-delay:3s;   animation-duration:14s"/>
      <circle class="pt" cx="800"  cy="350" r="2.5" style="animation-delay:7s;   animation-duration:10s"/>
      <circle class="pt" cx="930"  cy="350" r="1.5" style="animation-delay:4s;   animation-duration:12s"/>
      <circle class="pt" cx="1050" cy="350" r="2"   style="animation-delay:8s;   animation-duration:9s"/>
      <circle class="pt" cx="1160" cy="350" r="2"   style="animation-delay:2.5s; animation-duration:13s"/>
    </g>

    <!-- terminal header -->
    <circle cx="52" cy="44" r="6" fill="#FF5F56"/>
    <circle cx="74" cy="44" r="6" fill="#FFBD2E"/>
    <circle cx="96" cy="44" r="6" fill="#27C93F"/>
    <text class="mono" x="118" y="49" font-size="14" fill="#8B949E">evan@github:~$ whoami</text>

    <!-- name + role -->
    <text x="48" y="130" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1">Evan Atharasya</text>
    <text x="50" y="172" font-size="26" font-weight="600" fill="#C9D1D9">Full-Stack Developer</text>

    <!-- rotating phrases -->
    <g class="mono" font-size="20">
      <text class="ph p1" x="50" y="214"><tspan fill="#3FB950">$&#160;</tspan><tspan fill="#79C0FF">Building scalable web applications</tspan></text>
      <text class="ph p2" x="50" y="214"><tspan fill="#3FB950">$&#160;</tspan><tspan fill="#79C0FF">Shipping AI-powered tools and chatbots</tspan></text>
      <text class="ph p3" x="50" y="214"><tspan fill="#3FB950">$&#160;</tspan><tspan fill="#79C0FF">Automating the boring stuff</tspan></text>
      <text class="ph p4" x="50" y="214"><tspan fill="#3FB950">$&#160;</tspan><tspan fill="#79C0FF">Turning ideas into production-ready code</tspan></text>
    </g>

    <!-- status pills -->
    <rect x="50" y="248" width="206" height="36" rx="18" fill="#2EA043" fill-opacity="0.15" stroke="#2EA043"/>
    <circle class="pulse" cx="72" cy="266" r="4" fill="#3FB950"/>
    <circle cx="72" cy="266" r="4" fill="#3FB950"/>
    <text x="88" y="271" font-size="15" font-weight="600" fill="#3FB950">Open for freelance</text>

    <rect x="270" y="248" width="116" height="36" rx="18" fill="#1F6FEB" fill-opacity="0.15" stroke="#388BFD"/>
    <text x="328" y="271" font-size="15" font-weight="600" fill="#79C0FF" text-anchor="middle">Indonesia</text>

    <!-- floating code card -->
    <g class="card">
      <rect x="700" y="40" width="440" height="222" rx="12" fill="#161B22" stroke="#30363D"/>
      <path d="M700 52a12 12 0 0 1 12-12h416a12 12 0 0 1 12 12v20H700z" fill="#1C2128"/>
      <circle cx="722" cy="56" r="5" fill="#FF5F56"/>
      <circle cx="742" cy="56" r="5" fill="#FFBD2E"/>
      <circle cx="762" cy="56" r="5" fill="#27C93F"/>
      <text class="mono" x="788" y="61" font-size="13" fill="#8B949E">evan.ts</text>

      <g class="mono" font-size="16" xml:space="preserve">
        <text class="ln l1" x="724" y="104"><tspan fill="#FF7B72">const</tspan> <tspan fill="#D2A8FF">evan</tspan> <tspan fill="#C9D1D9">= {</tspan></text>
        <text class="ln l2" x="724" y="130"><tspan fill="#79C0FF">  role</tspan><tspan fill="#C9D1D9">: </tspan><tspan fill="#A5D6FF">"Full-Stack Developer"</tspan><tspan fill="#C9D1D9">,</tspan></text>
        <text class="ln l3" x="724" y="156"><tspan fill="#79C0FF">  stack</tspan><tspan fill="#C9D1D9">: [</tspan><tspan fill="#A5D6FF">"Next.js"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"PHP"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"Python"</tspan><tspan fill="#C9D1D9">],</tspan></text>
        <text class="ln l4" x="724" y="182"><tspan fill="#79C0FF">  focus</tspan><tspan fill="#C9D1D9">: </tspan><tspan fill="#A5D6FF">"AI + Automation"</tspan><tspan fill="#C9D1D9">,</tspan></text>
        <text class="ln l5" x="724" y="208"><tspan fill="#79C0FF">  available</tspan><tspan fill="#C9D1D9">: </tspan><tspan fill="#FF7B72">true</tspan><tspan fill="#C9D1D9">,</tspan></text>
        <text class="ln l6" x="724" y="234"><tspan fill="#C9D1D9">};</tspan></text>
      </g>
    </g>

    <!-- floating tech chips -->
    <g font-size="13" font-weight="600" fill="#C9D1D9" text-anchor="middle">
      <g class="chip c1"><rect x="700" y="288" width="82" height="28" rx="14" fill="#0D1117" stroke="#30363D"/><circle cx="716" cy="302" r="4" fill="#61DAFB"/><text x="752" y="307">React</text></g>
      <g class="chip c2"><rect x="794" y="288" width="92" height="28" rx="14" fill="#0D1117" stroke="#30363D"/><circle cx="810" cy="302" r="4" fill="#FFFFFF"/><text x="852" y="307">Next.js</text></g>
      <g class="chip c3"><rect x="898" y="288" width="76" height="28" rx="14" fill="#0D1117" stroke="#30363D"/><circle cx="914" cy="302" r="4" fill="#777BB4"/><text x="945" y="307">PHP</text></g>
      <g class="chip c4"><rect x="986" y="288" width="92" height="28" rx="14" fill="#0D1117" stroke="#30363D"/><circle cx="1002" cy="302" r="4" fill="#3776AB"/><text x="1045" y="307">Python</text></g>
      <g class="chip c5"><rect x="1090" y="288" width="50" height="28" rx="14" fill="#0D1117" stroke="#30363D"/><circle cx="1105" cy="302" r="4" fill="#3178C6"/><text x="1127" y="307">TS</text></g>
    </g>

    <!-- bottom light sweep -->
    <rect x="0" y="336" width="1200" height="4" fill="#1F6FEB" fill-opacity="0.35"/>
    <rect class="sweep" x="0" y="336" width="400" height="4" fill="url(#sweep)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#30363D"/>
</svg>
