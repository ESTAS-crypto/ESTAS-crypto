<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="1200" height="6" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1F6FEB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79C0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79C0FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#79C0FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="2" width="1200" height="2" rx="1"/></clipPath>
  </defs>
  <style>
    .g { animation: run 6s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-300px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .g { animation: none; } }
  </style>
  <rect x="0" y="2" width="1200" height="2" fill="url(#base)"/>
  <g clip-path="url(#c)">
    <rect class="g" x="0" y="0" width="300" height="6" fill="url(#glow)"/>
  </g>
</svg>
