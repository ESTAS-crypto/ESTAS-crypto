# OPSIONAL: membuat grafik kontribusi 3D (yoshi389111/github-profile-3d-contrib)
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # tiap hari, 01:00 WIB
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions:
  contents: write           # wajib, agar bot boleh commit hasilnya

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --cached --quiet || git commit -m "chore: update 3D contribution graph"
          git push
