<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Live portfolio: Dive into my work</title>
<desc id="d">Animated ocean banner. Fish labelled LUVENCE, VendTrack and SNBT swim past. Opens the interactive portfolio website of Evan Atharasya.</desc>
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B7FB3"/><stop offset="0.4" stop-color="#0B4A78"/><stop offset="1" stop-color="#04101F"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="260" rx="18"/></clipPath>
</defs>
<style>text{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'SFMono-Regular','Fira Code',Consolas,'Liberation Mono',Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.mono{font-family:'SFMono-Regular','Fira Code',Consolas,'Liberation Mono',Menlo,monospace}
.ray{animation:ray 6s ease-in-out infinite alternate}.r2{animation-delay:-2s}.r3{animation-delay:-4s}
@keyframes ray{from{opacity:.03}to{opacity:.11}}
.w1{animation:slide 10s linear infinite}.w2{animation:slide 15s linear infinite reverse}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
.bub{opacity:0;animation:rise 12s linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(10px,-140px)}90%{opacity:.5}100%{transform:translate(-4px,-290px);opacity:0}}
.swim{animation:swim 12s linear infinite}
@keyframes swim{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(-380px);opacity:0}}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.wag{transform-box:fill-box;transform-origin:0 50%;animation:wag .6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.diver{animation:dive 7s ease-in-out infinite alternate}@keyframes dive{from{transform:translateY(0)}to{transform:translateY(168px)}}
.arr{animation:nudge 1.8s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
